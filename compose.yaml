services:
  neo4j:
    image: neo4j:5.26.0-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD antes de iniciar}"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data:
